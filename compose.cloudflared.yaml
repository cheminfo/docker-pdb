# Cloudflare Tunnel deployment — no port published on the host.
#
# Cloudflare dashboard (https://dash.cloudflare.com):
#   Networking → Tunnels → Create a tunnel → Cloudflared connector →
#   copy the token into .env as TUNNEL_TOKEN=... → open the tunnel →
#   Published applications tab → add application with
#   Service = HTTP, URL = pdb-api:31015, Public hostname = pdb.lactame.com.
#
# Copy this file to compose.yaml and run: docker compose up -d
services:
  node-pdb-sync:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data:z
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    init: true
    # PyMol hard-caps concurrent processes at min(PYMOL_CONCURRENCY, 8).
    # Each child spawns ~15 OS threads (Python + OpenMP), so the worst case
    # is 8 × 15 = 120 PyMol threads + ~30 Node threads ≈ 150 total PIDs —
    # well within 1024.
    pids_limit: 1024
    # 16 GB covers 8 simultaneous PyMol renders (≈ 500 MB each) plus
    # headroom for Node, rsync, and chokidar.
    mem_limit: ${PYMOL_MEMORY_LIMIT:-16g}
    memswap_limit: ${PYMOL_MEMORY_LIMIT:-16g}
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron

  pdb-api:
    # Fastify server: HTTP API (substructure search, parsed PDB metadata,
    # stats aggregates, raw file streaming) AND the React/Vite bundle baked
    # into the image at /app/backend/public. cloudflared talks to it
    # directly — no separate nginx hop. On first start it seeds
    # data/sqlite/db.sqlite from the wwPDB Chemical Component Dictionary
    # if the `ligands` table is empty.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data:z
    env_file:
      - .env
    environment:
      DEBUG: '*'
      PORT: '31015'
    restart: unless-stopped
    init: true
    pids_limit: 1024
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # The CCD seed is owned by pdb-api-cron — pdb-api starts the API
    # immediately so cloudflared never returns 502 during the first boot.
    command: npm run api

  pdb-api-cron:
    # Periodically refreshes data/sqlite/db.sqlite from the wwPDB
    # Chemical Component Dictionary (weekly upstream cadence). Idle most
    # of the time, but the import phase synchronously parses ~40k CCD
    # entries through openchemlib and can briefly use >1 GiB of heap —
    # the generous mem_limit keeps it well clear of the OOM-killer.
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data:z
    env_file:
      - .env
    environment:
      DEBUG: '*'
      NODE_OPTIONS: '--max-old-space-size=6144'
    restart: unless-stopped
    init: true
    pids_limit: 1024
    mem_limit: 8g
    memswap_limit: 8g
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron-ccd

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - pdb-api
    restart: unless-stopped
