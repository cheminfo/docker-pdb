server {
    listen       80;
    server_name  localhost;

    location /view/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 0;
        proxy_pass http://couchdb:5984/pdb/_design/query/_view/;
    }

    location /stats/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 0;
        proxy_pass http://couchdb:5984/pdb/_design/stats/_view/;
    }

    # Mango query endpoint. POST is required by CouchDB's `_find`; the body
    # is the JSON selector. Read-only: cannot be used to write documents.
    location /find {
        if ($request_method !~ ^(GET|POST|HEAD)$) { return 405; }
        client_max_body_size 1m;
        proxy_pass http://couchdb:5984/pdb/_find;
    }

    location /pdb/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 0;
        proxy_pass http://couchdb:5984/pdb/;
    }

    location /assembly/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 0;
        proxy_pass http://couchdb:5984/pdb-bio-assembly/;
    }

    location /rsync-history/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 0;
        proxy_pass http://couchdb:5984/rsync-history/;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        root /data/www;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
