server {
    listen       80;
    server_name  localhost;

    # All HTTP API requests go to the Fastify backend, which serves parsed
    # PDB metadata, stats aggregates, and substructure search out of sqlite,
    # plus raw .pdb / .pdb1 streams and pymol thumbnails from disk.
    location /v1/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 1m;
        proxy_pass http://pdb-api:3000/v1/;
    }

    # Static frontend (built React/Vite bundle copied into the image).
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        root /data/www;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
