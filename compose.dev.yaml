# Local-development backend for `npm run dev`. Brings up the Fastify
# pdb-api and an nginx-proxy that serves the same `/v1/...` URL surface
# as the production stack — so the Vite dev server in `frontend/` can
# talk to it via `PDB_API_URL`.
#
# Project name is overridden so this dev stack is tracked separately
# from any production stack the developer might also have running.
name: docker-pdb-dev

services:
  pdb-api:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      DEBUG: '*'
      PORT: '3000'
    restart: unless-stopped
    command: npm run api

  # Same nginx config as the production stack so `/v1/...` resolves
  # identically. Bound to a separate port (12346) to avoid conflicting
  # with a production stack on 12345.
  nginx-proxy:
    image: docker.io/nginx:1.27
    ports:
      - '127.0.0.1:12346:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/data/www:ro
    depends_on:
      - pdb-api
    restart: unless-stopped
