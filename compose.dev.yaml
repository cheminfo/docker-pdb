# Local-development backend for `npm run dev`. Brings up CouchDB and an
# nginx-proxy that exposes the same HTTP API surface as the production
# stack (`/pdb`, `/assembly`, `/view`, `/stats`, `/find`) — so the Vite
# dev server in `frontend/` can talk to it via `PDB_API_URL`.
#
# Project name is overridden so this dev stack is tracked separately
# from any production stack the developer might also have running.
name: docker-pdb-dev

services:
  couchdb:
    image: docker.io/couchdb:3.4
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD:-changeme}
    ports:
      - '127.0.0.1:5984:5984'
    volumes:
      - couchdb-dev:/opt/couchdb/data
    restart: unless-stopped

  # Substructure-search API. Built from the local Dockerfile so the
  # dev nginx upstream `pdb-api:3000` resolves and `/v1/...` works
  # against the developer's working tree.
  pdb-api:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      DEBUG: '*'
      PORT: '3000'
    restart: unless-stopped
    command: sh -c "npm run seed-ccd; npm run api"

  # Same nginx config as the production stack so /find /view /stats etc.
  # all resolve identically. Bound to a separate port (12346) to avoid
  # conflicting with a production stack on 12345.
  nginx-proxy:
    image: docker.io/nginx:1.27
    ports:
      - '127.0.0.1:12346:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/data/www:ro
    depends_on:
      - couchdb
      - pdb-api
    restart: unless-stopped

volumes:
  couchdb-dev:
