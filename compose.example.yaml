services:
  nginx-proxy:
    image: docker.io/nginx:1.27
    ports:
      - '127.0.0.1:${NGINX_PORT}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/data/www:ro
    env_file:
      - .env
    depends_on:
      - pdb-api
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  node-pdb-sync:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron

  pdb-api:
    # Fastify server backing the entire HTTP API (substructure search,
    # parsed PDB metadata, stats aggregates, raw file streaming). On first
    # start it seeds data/sqlite/ligands.db from the wwPDB Chemical
    # Component Dictionary if the `ligands` table is empty.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
      PORT: '3000'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: sh -c "npm run seed-ccd; npm run api"

  pdb-api-cron:
    # Periodically refreshes data/sqlite/ligands.db from the wwPDB
    # Chemical Component Dictionary (weekly upstream cadence). Idle most
    # of the time. Independent of pdb-api: on a fresh deploy pdb-api
    # writes the initial copy and this cron sleeps until next week.
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron-ccd
