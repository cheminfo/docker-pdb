services:
  node-pdb-sync:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data:z
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    init: true
    pids_limit: 256
    # Sized for PYMOL_CONCURRENCY parallel pymol child processes. Both
    # come from .env so operators can tune them together; bump the
    # memory cap when raising the worker count.
    mem_limit: ${PYMOL_MEMORY_LIMIT:-16g}
    memswap_limit: ${PYMOL_MEMORY_LIMIT:-16g}
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron

  pdb-api:
    # Fastify server: HTTP API (substructure search, parsed PDB metadata,
    # stats aggregates, raw file streaming) AND the React/Vite bundle baked
    # into the image at /app/backend/public. On first start it seeds
    # data/sqlite/db.sqlite from the wwPDB Chemical Component Dictionary
    # if the `ligands` table is empty.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    ports:
      - '127.0.0.1:${PUBLIC_PORT}:3000'
    volumes:
      - ./data:/app/data:z
    env_file:
      - .env
    environment:
      DEBUG: '*'
      PORT: '3000'
    restart: unless-stopped
    init: true
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # The CCD seed is owned by pdb-api-cron — pdb-api starts the API
    # immediately so the homepage never 502s during the first boot.
    command: npm run api

  pdb-api-cron:
    # Periodically refreshes data/sqlite/db.sqlite from the wwPDB
    # Chemical Component Dictionary (weekly upstream cadence). Idle most
    # of the time, but the import phase synchronously parses ~40k CCD
    # entries through openchemlib and can briefly use >1 GiB of heap —
    # under tight cgroup limits the kernel OOM-killed it silently, which
    # is why we set a generous `mem_limit` here.
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data:z
    env_file:
      - .env
    environment:
      DEBUG: '*'
      # `--max-old-space-size` lifts the v8 heap cap above the default 4 GiB
      # so the OCL parse never aborts before the OOM-killer can intervene.
      NODE_OPTIONS: '--max-old-space-size=6144'
    restart: unless-stopped
    init: true
    pids_limit: 256
    mem_limit: 8g
    memswap_limit: 8g
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron-ccd
