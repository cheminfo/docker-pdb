services:
  nginx-proxy:
    image: docker.io/nginx:1.27
    ports:
      - '127.0.0.1:${NGINX_PORT}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/data/www:ro
    env_file:
      - .env
    depends_on:
      - couchdb
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  couchdb:
    image: docker.io/couchdb:3.4
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    volumes:
      - ./data/couchdb:/opt/couchdb/data
    env_file:
      - .env
    restart: unless-stopped
    pids_limit: 4096
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  node-pdb-sync:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/docker-pdb:latest
    build: .
    depends_on:
      - couchdb
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron
