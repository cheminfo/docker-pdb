services:
  node-pdb-sync:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    init: true
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron

  pdb-api:
    # Fastify server: HTTP API (substructure search, parsed PDB metadata,
    # stats aggregates, raw file streaming) AND the React/Vite bundle baked
    # into the image at /app/backend/public. On first start it seeds
    # data/sqlite/ligands.db from the wwPDB Chemical Component Dictionary
    # if the `ligands` table is empty.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    ports:
      - '127.0.0.1:${PUBLIC_PORT}:3000'
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
      PORT: '3000'
    restart: unless-stopped
    init: true
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # The CCD seed is owned by pdb-api-cron — pdb-api starts the API
    # immediately so the homepage never 502s during the first boot.
    command: npm run api

  pdb-api-cron:
    # Periodically refreshes data/sqlite/ligands.db from the wwPDB
    # Chemical Component Dictionary (weekly upstream cadence). Idle most
    # of the time. Independent of pdb-api: on a fresh deploy pdb-api
    # writes the initial copy and this cron sleeps until next week.
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    init: true
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron-ccd
