# Cloudflare Tunnel deployment — no port published on the host.
#
# Cloudflare dashboard (https://dash.cloudflare.com):
#   Networking → Tunnels → Create a tunnel → Cloudflared connector →
#   copy the token into .env as TUNNEL_TOKEN=... → open the tunnel →
#   Published applications tab → add application with
#   Service = HTTP, URL = nginx-proxy:80, Public hostname = pdb.lactame.com.
#
# Copy this file to compose.yaml and run: docker compose up -d
services:
  nginx-proxy:
    image: docker.io/nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/data/www:ro
    env_file:
      - .env
    depends_on:
      - couchdb
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  couchdb:
    image: docker.io/couchdb:3.4
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    volumes:
      - ./data/couchdb:/opt/couchdb/data
    env_file:
      - .env
    restart: unless-stopped
    pids_limit: 4096
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  node-pdb-sync:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    depends_on:
      - couchdb
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron

  pdb-api:
    # Lightweight Fastify server backing the substructure-search API. Reads
    # the SQLite ligands database written by node-pdb-sync; on first start
    # it also seeds the database from the wwPDB Chemical Component
    # Dictionary if the `ligands` table is empty.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
      PORT: '3000'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: sh -c "npm run seed-ccd; npm run api"

  pdb-api-cron:
    # Periodically refreshes data/sqlite3/ligands.db from the wwPDB
    # Chemical Component Dictionary (weekly upstream cadence). Idle most
    # of the time. Independent of pdb-api: on a fresh deploy pdb-api
    # writes the initial copy and this cron sleeps until next week.
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron-ccd

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx-proxy
    restart: unless-stopped
