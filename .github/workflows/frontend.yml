name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      # The repo is an npm workspace: install once from the root lockfile.
      # The unit tests, type-check, lint and format checks run in nodejs.yml;
      # this workflow only adds the Playwright end-to-end run.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test-e2e -w frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
