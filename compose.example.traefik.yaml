# Traefik reverse-proxy deployment — requires an external Docker network
# named `traefik` with a `websecure` entrypoint and `letsencrypt` cert resolver.
#
# Adjust the Host(...) label to your hostname (default: pdb.cheminfo.org).
# Copy this file to compose.yaml and run: docker compose up -d
services:
  nginx-proxy:
    image: docker.io/nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/data/www:ro
    env_file:
      - .env
    depends_on:
      - pdb-api
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pdb.rule=Host(`pdb.cheminfo.org`)'
      - 'traefik.http.routers.pdb.entrypoints=websecure'
      - 'traefik.http.routers.pdb.tls.certresolver=letsencrypt'
      - 'traefik.http.services.pdb.loadbalancer.server.port=80'
      - 'traefik.http.routers.pdb.middlewares=pdb-cors'
      - 'traefik.http.middlewares.pdb-cors.headers.accesscontrolalloworiginlist=*'
      - 'traefik.http.middlewares.pdb-cors.headers.accesscontrolallowheaders=Content-Type'
      - 'traefik.http.middlewares.pdb-cors.headers.accesscontrolmaxage=86400'

  node-pdb-sync:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron

  pdb-api:
    # Fastify server backing the entire HTTP API (substructure search,
    # parsed PDB metadata, stats aggregates, raw file streaming). On first
    # start it seeds data/sqlite/ligands.db from the wwPDB Chemical
    # Component Dictionary if the `ligands` table is empty.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
      PORT: '3000'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # The CCD seed is owned by pdb-api-cron — pdb-api starts the API
    # server immediately so the reverse proxy never returns 502 during
    # the first boot.
    command: npm run api

  pdb-api-cron:
    # Periodically refreshes data/sqlite/ligands.db from the wwPDB
    # Chemical Component Dictionary (weekly upstream cadence). Idle most
    # of the time. Independent of pdb-api: on a fresh deploy pdb-api
    # writes the initial copy and this cron sleeps until next week.
    image: ghcr.io/cheminfo/pdb-quickview:latest
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DEBUG: '*'
    restart: unless-stopped
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron-ccd

networks:
  traefik:
    external: true
